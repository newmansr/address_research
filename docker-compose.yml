version: "3.8"
services:
  osint-gui:
    build: .
    container_name: address-research
    restart: unless-stopped
    ports:
      # Bind to the Tailscale IP defined in the .env file
      - "${TAILSCALE_IP:-0.0.0.0}:8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist the SQLite history database
      - ./history.db:/app/history.db
      # Persist SeleniumBase profiles so Cloudflare cookies carry over
      - ./.chrome_profile:/app/.chrome_profile
    # Give the container extra shared memory so Chrome doesnt crash when rendering
    shm_size: '2gb'

