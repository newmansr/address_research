services:
  osint-gui:
    build: .
    container_name: address-research
    user: "root"
    restart: unless-stopped
    ports:
      # Homelab rule: bind LOOPBACK only, expose to the tailnet via a Tailscale Service by name.
      #   tailscale serve --service=svc:<name> --bg http://127.0.0.1:8501
      # Reached at https://<name>.tail9128d0.ts.net (NOT the node IP / :8501).
      - "127.0.0.1:8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist the SQLite history database
      - ./history.db:/app/history.db
      # Persist SeleniumBase profiles so Cloudflare cookies carry over
      - ./.chrome_profile:/app/.chrome_profile
    # Give the container extra shared memory so Chrome doesnt crash when rendering
    shm_size: '2gb'

